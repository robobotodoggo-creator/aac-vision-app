name: aac_vision_app
description: "Vision-aware AAC communication app for nonverbal users"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mlkit_object_detection: ^0.14.0
  camera: ^0.11.1
  flutter_tts: ^4.2.1
  http: ^1.3.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  wakelock_plus: ^1.3.2
  vibration: ^2.1.0
  share_plus: ^12.0.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
